services:
  database:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-sales_lens}
      POSTGRES_USER: ${DB_USER:-sales_lens}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev-only-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - sales_lens_postgres:/var/lib/postgresql/data

  backend:
    image: sales-lens-backend:local
    pull_policy: build
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sales_lens}
      DB_USER: ${DB_USER:-sales_lens}
      DB_PASSWORD: ${DB_PASSWORD:-dev-only-password}
      SERVER_PORT: 8080
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    image: sales-lens-frontend:local
    pull_policy: build
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  sales_lens_postgres:
