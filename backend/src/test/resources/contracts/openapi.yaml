openapi: 3.0.3
info:
  title: Sales Lens API
  version: 1.0.0
  description: 내부 테스트 전용 매출 조회 계약. 접근 제한 방식은 OQ-002로 확인 필요이며 외부 공개를 전제하지 않는다.
paths:
  /api/sales-dashboard:
    get:
      operationId: getSalesDashboard
      summary: 매출 대시보드 조회
      description: 동일한 적용 조건의 요약, 일별 추이, 지역별 실적, 주문 목록을 한 응답으로 반환한다.
      x-related-requirements:
      - REQ-002
      - REQ-007
      - REQ-009
      - REQ-010
      - REQ-011
      - REQ-012
      - REQ-013
      - REQ-016
      x-pagination:
        enabled: false
        reason: 테스트 주문은 최대 100건이며 페이지 분할을 제공하지 않는다.
      parameters:
      - name: startDate
        in: query
        required: true
        description: 양끝 포함 시작일, YYYY-MM-DD
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        required: true
        description: 양끝 포함 종료일, 시작일부터 최대 366일
        schema:
          type: string
          format: date
      - name: region
        in: query
        required: false
        description: 생략하면 전체 지역; 지정하면 해당 지역만 조회한다.
        schema:
          $ref: '#/components/schemas/Region'
      responses:
        '200':
          description: 매출 집계 및 주문 목록
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/SalesDashboard'
        '400':
          description: 날짜 또는 지역 조건 오류와 필드별 사유
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/health:
    get:
      operationId: getHealth
      summary: 서비스 상태 확인
      x-related-requirements:
      - REQ-029
      x-no-response-data-reason: 필수 health 경로는 정상 여부만 확인하며 추가 결과 데이터는 정의되지 않았다.
      responses:
        '200':
          description: 서비스 정상 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      required:
      - success
      - meta
      properties:
        success:
          type: boolean
          enum:
          - true
        meta:
          type: object
          description: 공통 응답 메타데이터; 세부 항목은 미정이다.
    ApiError:
      type: object
      required:
      - success
      - meta
      - fieldErrors
      properties:
        success:
          type: boolean
          enum:
          - false
        meta:
          type: object
          description: 공통 오류 메타데이터; 세부 항목은 미정이다.
        fieldErrors:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - field
            - reason
            properties:
              field:
                type: string
                description: 오류가 발생한 조회 조건 필드
              reason:
                type: string
                description: 해당 필드의 오류 사유
    Region:
      type: string
      enum:
      - SEOUL
      - BUSAN
    OrderStatus:
      type: string
      enum:
      - COMPLETED
      - CANCELLED
      description: 저장 주문의 상태; 조회 결과는 COMPLETED만 포함한다.
    SalesDashboard:
      type: object
      required:
      - summary
      - dailySales
      - regionalSales
      - orders
      properties:
        summary:
          type: object
          required:
          - totalSales
          - orderCount
          - averageOrderAmount
          properties:
            totalSales:
              type: integer
              format: int64
              minimum: 0
              description: 최종 주문금액 합계 원
            orderCount:
              type: integer
              minimum: 0
            averageOrderAmount:
              type: integer
              format: int64
              minimum: 0
              description: 총매출을 주문건수로 나눈 원 단위 반올림 값; 주문이 없으면 0
        dailySales:
          type: array
          description: 기간 내 모든 날짜를 오름차순으로 반환하며 주문 없는 날은 0이다.
          items:
            type: object
            required:
            - date
            - totalSales
            properties:
              date:
                type: string
                format: date
              totalSales:
                type: integer
                format: int64
                minimum: 0
        regionalSales:
          type: array
          description: 전체 선택은 SEOUL, BUSAN 순서; 단일 지역은 한 행이며 주문이 없어도 0이다.
          items:
            type: object
            required:
            - region
            - totalSales
            - orderCount
            properties:
              region:
                $ref: '#/components/schemas/Region'
              totalSales:
                type: integer
                format: int64
                minimum: 0
              orderCount:
                type: integer
                minimum: 0
        orders:
          type: array
          maxItems: 100
          description: 주문일자 내림차순, 같은 날짜 주문번호 오름차순이다.
          items:
            type: object
            required:
            - orderNumber
            - orderDate
            - region
            - amount
            properties:
              orderNumber:
                type: string
              orderDate:
                type: string
                format: date
              region:
                $ref: '#/components/schemas/Region'
              amount:
                type: integer
                format: int64
                minimum: 1
